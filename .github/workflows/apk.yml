name: Gerar APK

# Roda a cada envio de código e também sob demanda, pelo botão
# "Run workflow" na aba Actions do GitHub.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  apk:
    name: Compilar o aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar o Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar o SDK do Android
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      # ---------- Aplicativo ----------
      # A pasta android/ não fica versionada: é gerada a partir de www/ e do
      # capacitor.config.json, então nunca fica fora de sincronia.
      - name: Criar o projeto Android
        run: npx cap add android

      - name: Copiar os arquivos do aplicativo
        run: npx cap sync android

      - name: Compilar o APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Guardar o APK do aplicativo
        run: |
          mkdir -p entrega
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "entrega/ekklesia-music-$(date +%Y-%m-%d)-${GITHUB_SHA::7}.apk"

      # ---------- Versão de teste ----------
      # Mesmo aplicativo, sem nuvem e com outro identificador, para instalar
      # ao lado do de verdade e experimentar sem risco nenhum.
      - name: Preparar a versão de teste
        run: npm run build:teste

      # O Capacitor lê sempre o capacitor.config.json da raiz — não existe
      # opção de linha de comando para apontar outro arquivo. Por isso a
      # configuração de teste toma o lugar dele e depois é devolvida.
      - name: Compilar o APK de teste
        run: |
          set -e
          mv capacitor.config.json capacitor.config.original.json
          cp capacitor.config.teste.json capacitor.config.json
          rm -rf android
          npx cap add android
          npx cap sync android
          ( cd android && ./gradlew assembleDebug --no-daemon )
          mv capacitor.config.original.json capacitor.config.json

      - name: Guardar o APK de teste
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "entrega/ekklesia-TESTE-$(date +%Y-%m-%d)-${GITHUB_SHA::7}.apk"

      - name: Conferir o que foi gerado
        if: always()
        run: ls -lh entrega/ 2>/dev/null || echo 'nada foi gerado'

      # always(): se a versão de teste falhar, o APK do aplicativo — que já
      # está pronto — continua disponível para download. Antes uma falha no
      # teste levava os dois embora.
      - name: Publicar os APKs para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekklesia-music-apk
          path: entrega/*.apk
          retention-days: 30
          if-no-files-found: warn
