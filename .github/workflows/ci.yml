name: Testes

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: Verificações e testes de navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      # Roda antes do navegador: é rápido e pega erro de sintaxe
      # sem esperar o download do Chromium.
      - name: Verificações estáticas
        run: npm run test:static

      # Sobe um PostgreSQL de mentira, aplica o schema de verdade e confere
      # que uma igreja não alcança os dados de outra. Sem isso, um erro nas
      # regras de acesso só apareceria depois de publicado.
      - name: Isolamento entre igrejas
        run: npm run test:banco
        env:
          # Aqui o PostgreSQL sempre existe. Se um dia sumir, é para
          # reprovar — não para passar batido com um aviso.
          EXIGE_BANCO: '1'

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e
