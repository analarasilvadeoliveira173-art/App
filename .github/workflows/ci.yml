name: Testes

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: Verificações e testes de navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      # Roda antes do navegador: é rápido e pega erro de sintaxe
      # sem esperar o download do Chromium.
      - name: Verificações estáticas
        run: npm run test:static

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e
