<!doctype html>
<html lang="pt-BR" data-tema-inicial>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9f8">
  <meta name="description" content="Escalas, repertório e ensaios do ministério de louvor, na palma da mão.">
  <title>Ekklesia Music</title>
  <link rel="icon" href="./icone.svg" type="image/svg+xml">
  <link rel="manifest" href="./app.webmanifest">

  <!-- O tema é aplicado antes da primeira pintura. Deixar para o
       JavaScript principal faz a tela piscar branca antes de escurecer. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ekklesia.tema') || 'auto';
        if (t !== 'auto') document.documentElement.setAttribute('data-tema', t);
        var escuro = t === 'escuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name=theme-color]').content = escuro ? '#0f1614' : '#f7f9f8';
      } catch (e) { /* modo anônimo: segue no tema claro */ }
    })();
  </script>
</head>
<body>
  <!-- Abertura: some assim que o aplicativo decide para onde levar a
       pessoa. Sem ela, o primeiro quadro é uma página em branco. -->
  <div class="abertura" id="abertura">
    <div class="abertura-miolo">
      <div class="marca-selo" style="width:56px;height:56px;font-size:1.5rem">E</div>
      <div class="girando" role="status" aria-label="Carregando"></div>
    </div>
  </div>

  <div id="raiz"></div>

  <script type="module" src="/src/principal.js"></script>
</body>
</html>
